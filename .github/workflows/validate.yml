name: Validar Lay Out 2.0

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: node --check app.js
      - run: node --check sw.js
      - run: python tools/cleanup_assets.py
      - run: python tools/audit_project.py
