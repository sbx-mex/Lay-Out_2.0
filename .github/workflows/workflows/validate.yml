name: Validar Lay Out 2.0

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow pypdf numpy scipy
      - run: node --check app.js
      - run: node --check dm-validation.js
      - run: node --check sw.js
      - run: python tools/optimize_ui_assets.py --check
      - run: python tools/clean_reference_titles.py --check
      - run: python tools/audit_performance.py
      - run: python tools/calibrate_dm_infographic.py --check
      - run: python tools/cleanup_assets.py
      - run: python tools/audit_project.py
      - run: python tools/audit_pdf_export.py --output-dir /tmp/layout-pdf-audit
